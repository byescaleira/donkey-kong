name: ScrapSpire
options:
  bundleIdPrefix: com.byescaleira
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  minimumXcodeGenVersion: "2.40.0"

packages:
  ArcadeKit:
    path: ../ArcadeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  ScrapSpire:
    type: application
    supportedDestinations: [iOS, macOS, tvOS]
    sources:
      - path: ScrapSpire
    dependencies:
      - package: ArcadeKit
        product: ArcadeKit
    settings:
      base:
        PRODUCT_NAME: Scrap Spire
        PRODUCT_BUNDLE_IDENTIFIER: com.byescaleira.donkey-kong
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Scrap Spire
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        ENABLE_PREVIEWS: YES
        METAL_FAST_MATH: YES

schemes:
  ScrapSpire:
    build:
      targets:
        ScrapSpire: all
    run:
      config: Debug
    test:
      config: Debug
